name: Bug report
description: hybrid did something other than what it says it does.
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what it did.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest thing that shows it. A saved page, a URL, or a local HTML fixture is ideal — attach it if you can share it.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: hybrid version
      placeholder: 'x.y.z'
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: 'Ubuntu 24.04, Python 3.12.5'
    validations:
      required: true
