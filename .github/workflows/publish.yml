# Publish hybrid-router to PyPI on every GitHub release, via Trusted Publishing
# (OIDC — no API token anywhere).
#
# One-time setup (account owner, web UI only):
#   pypi.org -> account -> Publishing -> add a "pending" publisher:
#     PyPI project name: hybrid-router
#     Owner: askalf     Repository: hybrid
#     Workflow name: publish.yml
#     Environment name: pypi
# The first release after that creates the project; the pending publisher becomes a
# normal one automatically. Until then, this workflow fails on releases — harmless.
name: publish

on:
  release:
    types: [published]
  # Recovery path. GitHub only allows re-running a workflow run for ~30 days, so a
  # first publish that failed while the pending publisher was still unregistered
  # becomes unrecoverable once that window closes — short of cutting a throwaway
  # release purely to re-fire this workflow. A dispatch publishes whatever version
  # is on the selected ref; PyPI rejects a version that already exists, so this
  # cannot overwrite or clobber an already-published release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC exchange IS the credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build sdist + wheel
        run: |
          python -m pip install --require-hashes -r .github/build-requirements.txt
          python -m build
      # Release runs only: GITHUB_REF_NAME is the tag there. On a manual dispatch it is
      # the branch name, which would fail this check for a reason that says nothing about
      # the package — so the guard is scoped to the event it was written for.
      - name: sanity — tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          pkg=$(python -c "import hybrid; print(hybrid.__version__)")
          test "v$pkg" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != hybrid.__version__ $pkg"; exit 1; }
      - name: show what a dispatch is about to publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -c "import hybrid; print('publishing hybrid-router', hybrid.__version__, 'from ${{ github.ref_name }}')"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
